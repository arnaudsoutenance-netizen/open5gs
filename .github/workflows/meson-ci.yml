name: Meson Continuous Integration
on: [push, pull_request]

jobs:
  macos-latest:
    name: Build and Test on MacOS Latest
    runs-on: macos-latest
    steps:
    - name: Install and start MongoDB
      run: |
          brew tap mongodb/brew
          brew trust mongodb/brew
          brew install mongodb/brew/mongodb-community@8.0
          brew services start mongodb/brew/mongodb-community@8.0
          for attempt in {1..30}; do
              if mongosh --quiet \
                  'mongodb://127.0.0.1:27017/?serverSelectionTimeoutMS=1000' \
                  --eval 'quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)' \
                  >/dev/null 2>&1; then
                  exit 0
              fi
              sleep 1
          done
          echo "::error::MongoDB did not become ready"
          mongo_log="$(brew --prefix)/var/log/mongodb/mongo.log"
          if [ -f "$mongo_log" ]; then
              tail -n 100 "$mongo_log"
          fi
          exit 1
    - name: Configure loopback addresses for tests
      run: |
          sudo ifconfig lo0 alias 127.0.0.2 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.3 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.4 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.5 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.6 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.7 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.8 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.9 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.10 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.11 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.12 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.13 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.14 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.15 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.16 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.17 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.18 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.19 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.20 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.21 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.50 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.0.200 netmask 255.255.255.255
          sudo ifconfig lo0 alias 127.0.1.10 netmask 255.255.255.255
    - name: Install the dependencies for building the source code.
      run: brew install mongo-c-driver libidn libgcrypt gnutls openssl libmicrohttpd nghttp2 bison libusrsctp libtins talloc meson
    - name: Check out repository code
      uses: actions/checkout@main
    - name: Setup Meson Build
      run: |
          brew_prefix="$(brew --prefix)"
          export PATH="$(brew --prefix bison)/bin:$PATH"
          export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CFLAGS="-I${brew_prefix}/include ${CFLAGS:-}"
          export CXXFLAGS="-I${brew_prefix}/include ${CXXFLAGS:-}"
          export LDFLAGS="-L${brew_prefix}/lib ${LDFLAGS:-}"
          meson setup build
      env:
        CC: gcc
    - name : Build Open5GS
      run: ninja -C build
    - name: Test Open5GS with handover diagnostics
      shell: bash
      run: |
          mkdir -p build/macos-handover-diagnostics
          git rev-parse HEAD > build/macos-handover-diagnostics/commit.txt
          set +e
          sudo "$(command -v python3)" \
              .github/scripts/macos-handover-diagnostics.py \
              build "$(command -v meson)" \
              2>&1 | tee build/macos-handover-diagnostics/console.log
          status=("${PIPESTATUS[@]}")
          if [ "${status[0]}" -ne 0 ]; then
              exit "${status[0]}"
          fi
          exit "${status[1]}"
    - name: Make diagnostic files readable
      if: always()
      run: |
          for path in build/meson-logs build/macos-handover-diagnostics; do
              if [ -d "$path" ]; then
                  sudo chown -R "$(id -u):$(id -g)" "$path"
              fi
          done
    - name: Upload macOS test diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: macos-handover-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          build/meson-logs/
          build/macos-handover-diagnostics/
        if-no-files-found: warn
        retention-days: 7

  ubuntu-latest:
    name: Build and Test on Ubuntu Latest
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo
        ports:
          - 27017:27017
    steps:
    - name: Create the TUN device with the interface name `ogstun`.
      run: |
          sudo ip tuntap add name ogstun mode tun
          sudo ip addr add 10.45.0.1/16 dev ogstun
          sudo ip addr add 2001:db8:cafe::1/48 dev ogstun
          sudo ip link set ogstun up
    - name: Install the dependencies for building the source code.
      run: |
          sudo apt update
          sudo apt install python3-pip python3-setuptools python3-wheel ninja-build build-essential flex bison git libsctp-dev libgnutls28-dev libgcrypt-dev libssl-dev libidn11-dev libmongoc-dev libbson-dev libyaml-dev libnghttp2-dev libmicrohttpd-dev libcurl4-gnutls-dev libnghttp2-dev libtins-dev libtalloc-dev libc-ares-dev meson
    - name: Check out repository code
      uses: actions/checkout@main
    - name: Setup Meson Build
      run: meson setup build
      env:
        CC: gcc
    - name : Build Open5GS
      run: ninja -C build
    - name: Test Open5GS
      run: meson test -C build -v -t 3
